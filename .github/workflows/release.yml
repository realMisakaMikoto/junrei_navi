name: Signed APK Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v0.2.5 or v0.2.5-rc.N tag to release
        required: true
        default: v0.2.5
        type: string

permissions:
  contents: read

concurrency:
  group: v0.2.5-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      candidate_commit: ${{ steps.resolve.outputs.candidate_commit }}
      tag_object_sha: ${{ steps.resolve.outputs.tag_object_sha }}
    steps:
      - name: Resolve the existing v0.2.5 tag from the default branch workflow
        id: resolve
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          [[ "$REQUESTED_TAG" =~ ^v0\.2\.5(-rc\.[1-9][0-9]*)?$ ]]

          repository_url="${GITHUB_SERVER_URL%/}/${GITHUB_REPOSITORY}.git"
          default_ref="refs/heads/$DEFAULT_BRANCH"
          default_refs="$(git ls-remote --exit-code --heads "$repository_url" "$default_ref")"
          test "$(awk -v ref="$default_ref" '$2 == ref { count++ } END { print count + 0 }' <<<"$default_refs")" -eq 1
          remote_default_sha="$(awk -v ref="$default_ref" '$2 == ref { print $1 }' <<<"$default_refs")"
          test "$remote_default_sha" = "$GITHUB_SHA"

          tag_ref="refs/tags/$REQUESTED_TAG"
          peeled_ref="$tag_ref^{}"
          remote_refs="$(
            git ls-remote --exit-code --tags "$repository_url" "$tag_ref" "$peeled_ref"
          )"

          tag_ref_count="$(
            awk -v ref="$tag_ref" '$2 == ref { count++ } END { print count + 0 }' <<<"$remote_refs"
          )"
          peeled_ref_count="$(
            awk -v ref="$peeled_ref" '$2 == ref { count++ } END { print count + 0 }' <<<"$remote_refs"
          )"
          test "$tag_ref_count" -eq 1
          test "$peeled_ref_count" -le 1

          tag_object_sha="$(awk -v ref="$tag_ref" '$2 == ref { print $1 }' <<<"$remote_refs")"
          candidate_commit="$(awk -v ref="$peeled_ref" '$2 == ref { print $1 }' <<<"$remote_refs")"
          if [ -z "$candidate_commit" ]; then
            candidate_commit="$tag_object_sha"
          fi
          [[ "$tag_object_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$candidate_commit" =~ ^[0-9a-f]{40}$ ]]

          printf 'tag_object_sha=%s\n' "$tag_object_sha" >> "$GITHUB_OUTPUT"
          printf 'candidate_commit=%s\n' "$candidate_commit" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: v0.2.5-release
    permissions:
      contents: read
    steps:
      - name: Verify the protected approved commit before checkout
        env:
          ANITABI_V025_APPROVED_COMMIT: ${{ secrets.ANITABI_V025_APPROVED_COMMIT }}
          CANDIDATE_COMMIT: ${{ needs.preflight.outputs.candidate_commit }}
        run: |
          set -euo pipefail
          [[ "$ANITABI_V025_APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$ANITABI_V025_APPROVED_COMMIT" = "$CANDIDATE_COMMIT"

      - name: Fetch only the exact approved tag target without retained credentials
        env:
          APPROVED_COMMIT: ${{ secrets.ANITABI_V025_APPROVED_COMMIT }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          repository_url="${GITHUB_SERVER_URL%/}/${GITHUB_REPOSITORY}.git"
          git init candidate
          git -C candidate remote add origin "$repository_url"
          git -C candidate fetch --no-tags --depth=1 origin "refs/tags/$REQUESTED_TAG"
          fetched_commit="$(git -C candidate rev-parse 'FETCH_HEAD^{commit}')"
          test "$fetched_commit" = "$APPROVED_COMMIT"
          git -C candidate -c advice.detachedHead=false checkout --detach "$APPROVED_COMMIT"
          test "$(git -C candidate rev-parse 'HEAD^{commit}')" = "$APPROVED_COMMIT"

      - name: Verify the uniquely anchored release gate and candidate version
        working-directory: candidate
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gate_file="docs/V0.2.5_RELEASE_GATE.md"
          test "$(grep -c '^releaseGateStatus:' "$gate_file" || true)" -eq 1
          test "$(grep -c '^releaseGateStatus: READY$' "$gate_file" || true)" -eq 1

          tag_version="${REQUESTED_TAG#v}"
          expected_version="${tag_version%%-rc.*}"
          test "$expected_version" = "0.2.5"
          actual_versions="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          test "$(printf '%s\n' "$actual_versions" | grep -c .)" -eq 1
          test "$actual_versions" = "$expected_version"

          notes_file="docs/RELEASE_NOTES_v0.2.5.md"
          test -s "$notes_file"
          ! grep -q '^DRAFT' "$notes_file"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: candidate/backend/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Audit tracked source for credentials
        working-directory: candidate
        run: bash .github/scripts/audit-source-secrets.sh

      - name: Restore approved v0.2.5 region data
        env:
          ANITABI_V025_REGION_DATA_URL: ${{ secrets.ANITABI_V025_REGION_DATA_URL }}
          ANITABI_V025_REGION_DATA_BEARER_TOKEN: ${{ secrets.ANITABI_V025_REGION_DATA_BEARER_TOKEN }}
          ANITABI_V025_REGION_DATA_SHA256: ${{ secrets.ANITABI_V025_REGION_DATA_SHA256 }}
          ANITABI_V025_REGION_DATA_VERSION: ${{ secrets.ANITABI_V025_REGION_DATA_VERSION }}
        run: |
          set -euo pipefail
          [[ "$ANITABI_V025_REGION_DATA_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ANITABI_V025_REGION_DATA_VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]
          node -e '
            const raw = process.argv[1];
            const url = new URL(raw);
            if (!raw.startsWith("https://") || url.protocol !== "https:" || !url.hostname ||
                url.username || url.password || url.hash) process.exit(1);
          ' "$ANITABI_V025_REGION_DATA_URL"

          downloaded_asset="$RUNNER_TEMP/territory_regions_v1.json"
          region_asset="candidate/app/src/main/assets/approved_regions/territory_regions_v1.json"
          umask 077
          curl_args=(
            --proto '=https'
            --tlsv1.2
            --fail
            --silent
            --show-error
            --max-redirs 0
            --connect-timeout 15
            --max-time 120
            --max-filesize 67108864
            --output "$downloaded_asset"
          )
          if [ -n "$ANITABI_V025_REGION_DATA_BEARER_TOKEN" ]; then
            curl_args+=(--header "Authorization: Bearer $ANITABI_V025_REGION_DATA_BEARER_TOKEN")
          fi
          curl "${curl_args[@]}" "$ANITABI_V025_REGION_DATA_URL"
          test -s "$downloaded_asset"
          test "$(stat -c '%s' "$downloaded_asset")" -le 67108864
          actual_sha256="$(sha256sum "$downloaded_asset" | cut -d ' ' -f 1)"
          test "$actual_sha256" = "$ANITABI_V025_REGION_DATA_SHA256"
          install -d -m 700 "$(dirname "$region_asset")"
          install -m 600 "$downloaded_asset" "$region_asset"

      - name: Verify backend candidate
        working-directory: candidate/backend
        env:
          ANITABI_V025_REGION_DATA_VERSION: ${{ secrets.ANITABI_V025_REGION_DATA_VERSION }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test
          npm run build
          node --input-type=module <<'NODE'
          import { TerritoryRegionClassifier } from "./dist/region/classifier.js";

          const classifier = TerritoryRegionClassifier.load(
            "../app/src/main/assets/approved_regions/territory_regions_v1.json",
          );
          if (classifier.metadata.version !== process.env.ANITABI_V025_REGION_DATA_VERSION) {
            throw new Error("Approved region data version does not match the protected release value");
          }
          NODE
          npm audit --omit=dev
          docker build --tag anitabi-api:"${REQUESTED_TAG#v}" .

      - name: Restore Firebase configuration and release keystore
        env:
          ANITABI_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANITABI_GOOGLE_SERVICES_JSON_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.ANITABI_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANITABI_GOOGLE_SERVICES_JSON_BASE64"
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$ANITABI_GOOGLE_SERVICES_JSON_BASE64" |
            base64 --decode > candidate/app/google-services.json
          printf '%s' "$KEYSTORE_BASE64" |
            base64 --decode > "$RUNNER_TEMP/anitabi-release.jks"
          test -s candidate/app/google-services.json
          test -s "$RUNNER_TEMP/anitabi-release.jks"
          node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' \
            candidate/app/google-services.json

      - name: Test and build signed release APK
        working-directory: candidate
        env:
          ANITABI_STORE_FILE: ${{ runner.temp }}/anitabi-release.jks
          ANITABI_STORE_PASSWORD: ${{ secrets.ANITABI_STORE_PASSWORD }}
          ANITABI_KEY_ALIAS: ${{ secrets.ANITABI_KEY_ALIAS }}
          ANITABI_KEY_PASSWORD: ${{ secrets.ANITABI_KEY_PASSWORD }}
          ANITABI_NAVIGATION_API_KEY: ${{ secrets.ANITABI_NAVIGATION_API_KEY }}
          ANITABI_AMAP_API_KEY: ${{ secrets.ANITABI_AMAP_API_KEY }}
          ANITABI_V025_REGION_DATA_VERSION: ${{ secrets.ANITABI_V025_REGION_DATA_VERSION }}
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease --stacktrace

      - name: Verify release R8 map reflection contract
        working-directory: candidate
        run: bash .github/scripts/audit-navigation-r8.sh

      - name: Audit release APK contents and approved region asset
        working-directory: candidate
        env:
          ANITABI_V025_REGION_DATA_SHA256: ${{ secrets.ANITABI_V025_REGION_DATA_SHA256 }}
        run: |
          bash .github/scripts/audit-apk.sh \
            app/build/outputs/apk/release/app-release.apk \
            "$ANITABI_V025_REGION_DATA_SHA256"

      - name: Verify APK signature
        working-directory: candidate
        run: |
          bash .github/scripts/audit-apk-signature.sh \
            app/build/outputs/apk/release/app-release.apk \
            "$ANDROID_HOME/build-tools/37.0.0/apksigner"

      - name: Package the read-only publication payload
        env:
          APPROVED_COMMIT: ${{ secrets.ANITABI_V025_APPROVED_COMMIT }}
          REGION_DATA_SHA256: ${{ secrets.ANITABI_V025_REGION_DATA_SHA256 }}
          REQUESTED_TAG: ${{ inputs.tag }}
          TAG_OBJECT_SHA: ${{ needs.preflight.outputs.tag_object_sha }}
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/release-payload"
          install -d -m 700 "$payload"
          apk_name="anitabi-$REQUESTED_TAG.apk"
          install -m 600 candidate/app/build/outputs/apk/release/app-release.apk "$payload/$apk_name"
          (
            cd "$payload"
            sha256sum "$apk_name" > "$apk_name.sha256"
          )
          install -m 600 candidate/docs/RELEASE_NOTES_v0.2.5.md "$payload/release-notes.md"
          {
            printf 'tag=%s\n' "$REQUESTED_TAG"
            printf 'tag_object_sha=%s\n' "$TAG_OBJECT_SHA"
            printf 'candidate_commit=%s\n' "$APPROVED_COMMIT"
            printf 'region_data_sha256=%s\n' "$REGION_DATA_SHA256"
          } > "$payload/release-metadata.txt"
          chmod 600 "$payload/release-metadata.txt"

      - name: Upload the verified publication payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: anitabi-${{ inputs.tag }}-release-candidate
          path: ${{ runner.temp }}/release-payload
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Remove restored release secrets
        if: always()
        run: |
          rm -f candidate/app/google-services.json
          rm -f candidate/app/src/main/assets/approved_regions/territory_regions_v1.json
          rm -f "$RUNNER_TEMP/anitabi-release.jks"
          rm -f "$RUNNER_TEMP/territory_regions_v1.json"

  publish:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: v0.2.5-release
    permissions:
      contents: read
    steps:
      - name: Download the verified publication payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: anitabi-${{ inputs.tag }}-release-candidate
          path: ${{ runner.temp }}/release-payload

      - name: Revalidate the payload and publish the unchanged tag target
        env:
          ANITABI_RELEASE_TOKEN: ${{ secrets.ANITABI_RELEASE_TOKEN }}
          ANITABI_V025_APPROVED_COMMIT: ${{ secrets.ANITABI_V025_APPROVED_COMMIT }}
          ANITABI_V025_REGION_DATA_SHA256: ${{ secrets.ANITABI_V025_REGION_DATA_SHA256 }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.preflight.outputs.tag_object_sha }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test -n "$ANITABI_RELEASE_TOKEN"
          [[ "$REQUESTED_TAG" =~ ^v0\.2\.5(-rc\.[1-9][0-9]*)?$ ]]
          [[ "$ANITABI_V025_APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ANITABI_V025_REGION_DATA_SHA256" =~ ^[0-9a-f]{64}$ ]]

          payload="$RUNNER_TEMP/release-payload"
          apk_name="anitabi-$REQUESTED_TAG.apk"
          apk="$payload/$apk_name"
          checksum="$payload/$apk_name.sha256"
          metadata="$payload/release-metadata.txt"
          notes="$payload/release-notes.md"
          test -s "$apk"
          test -s "$checksum"
          test -s "$metadata"
          test -s "$notes"
          ! grep -q '^DRAFT' "$notes"
          test "$(wc -l < "$metadata")" -eq 4
          grep -Fqx "tag=$REQUESTED_TAG" "$metadata"
          grep -Fqx "tag_object_sha=$EXPECTED_TAG_OBJECT_SHA" "$metadata"
          grep -Fqx "candidate_commit=$ANITABI_V025_APPROVED_COMMIT" "$metadata"
          grep -Fqx "region_data_sha256=$ANITABI_V025_REGION_DATA_SHA256" "$metadata"
          (
            cd "$payload"
            sha256sum --check --strict "$apk_name.sha256"
          )

          region_asset="assets/approved_regions/territory_regions_v1.json"
          test "$(unzip -Z1 "$apk" | grep -Fxc "$region_asset" || true)" -eq 1
          packaged_region_sha256="$(unzip -p "$apk" "$region_asset" | sha256sum | cut -d ' ' -f 1)"
          test "$packaged_region_sha256" = "$ANITABI_V025_REGION_DATA_SHA256"

          release_flags=()
          case "$REQUESTED_TAG" in
            *-rc.*) release_flags+=(--prerelease) ;;
          esac

          repository_url="${GITHUB_SERVER_URL%/}/${GITHUB_REPOSITORY}.git"
          tag_ref="refs/tags/$REQUESTED_TAG"
          peeled_ref="$tag_ref^{}"
          remote_refs="$(
            git ls-remote --exit-code --tags "$repository_url" "$tag_ref" "$peeled_ref"
          )"
          test "$(awk -v ref="$tag_ref" '$2 == ref { count++ } END { print count + 0 }' <<<"$remote_refs")" -eq 1
          test "$(awk -v ref="$peeled_ref" '$2 == ref { count++ } END { print count + 0 }' <<<"$remote_refs")" -le 1
          current_tag_object="$(awk -v ref="$tag_ref" '$2 == ref { print $1 }' <<<"$remote_refs")"
          current_commit="$(awk -v ref="$peeled_ref" '$2 == ref { print $1 }' <<<"$remote_refs")"
          if [ -z "$current_commit" ]; then
            current_commit="$current_tag_object"
          fi
          test "$current_tag_object" = "$EXPECTED_TAG_OBJECT_SHA"
          test "$current_commit" = "$ANITABI_V025_APPROVED_COMMIT"

          GH_TOKEN="$ANITABI_RELEASE_TOKEN" gh release create "$REQUESTED_TAG" \
            "$apk" \
            "$checksum" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --notes-file "$notes" \
            --title "$REQUESTED_TAG" \
            "${release_flags[@]}"
