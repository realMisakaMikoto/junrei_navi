server {
    listen 80;
    listen [::]:80;
    server_name api.anitabi.afunnypersonlol0.site;

    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.anitabi.afunnypersonlol0.site;

    ssl_certificate /etc/letsencrypt/live/api.anitabi.afunnypersonlol0.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.anitabi.afunnypersonlol0.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 16k;
    access_log off;
    error_log /dev/null crit;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
